apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: reactive-resume
  name: reactive-resume
  namespace: resume
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reactive-resume
  template:
    metadata:
      labels:
        app: reactive-resume
    spec:
      containers:
      - image: ghcr.io/amruthpillai/reactive-resume:v5.2.6
        name: reactive-resume
        env:
          - name: APP_URL
            value: "http://resume.huntrrose.com"
          - name: PUBLIC_URL
            value: "http://resume.huntrrose.com"
          - name: PG_USER
            valueFrom:
              secretKeyRef:
                name: resume-db-secret
                key: username
          - name: PG_PASS
            valueFrom:
              secretKeyRef:
                name: resume-db-secret
                key: password
          - name: DATABASE_URL
            value: "postgres://$(PG_USER):$(PG_PASS)@cnpg-cluster-rw.cnpg-cluster.svc.cluster.local:5432/resume-db"
        ports:
          - containerPort: 3000
        volumeMounts:
          - mountPath: /app/data
            name: resumedata
      volumes:
        - name: resumedata
          persistentVolumeClaim:
            claimName: resume-storage
