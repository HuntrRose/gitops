# vault-static-secret.yaml
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: resume-secrets-conf
  namespace: resume 
spec:
  # Authentication reference
  vaultAuthRef: resume/resume-vault-auth

  # Vault path (KV v2)
  mount: kv2
  type: kv-v2
  path: data/rr-cred

  # Kubernetes Secret to create
  destination:
    name: resume-db-secret
 #   namespace: resume
    create: true

  # Refresh interval
  refreshAfter: 1h

  # Rollout restart annotations
#  rolloutRestartTargets:
#  - kind: Deployment
#    name: myapp
