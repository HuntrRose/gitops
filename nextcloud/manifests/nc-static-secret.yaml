# vault-static-secret.yaml
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: nc-secrets-conf
  namespace: nextcloud 
spec:
  # Authentication reference
  vaultAuthRef: nextcloud/nc-vault-auth

  # Vault path (KV v2)
  mount: kv2
  type: kv-v2
  path: data/nc-db-user

  # Kubernetes Secret to create
  destination:
    name: nc-db-secret
 #   namespace: resume
    create: true

  # Refresh interval
  refreshAfter: 1h

  # Rollout restart annotations
#  rolloutRestartTargets:
#  - kind: Deployment
#    name: myapp
