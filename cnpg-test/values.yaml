cluster:
  storage:
    size: 10Gi
    storageClass: local-path
  walStorage:
    enabled: true
    storageClass: nfs-server
  monitoring:
    enabled: true
    podMonitor:
      enabled: true
    prometheusRule:
      enabled: true
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 500Mi
  affinity:
    enablePodAntiAffinity: true
