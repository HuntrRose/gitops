cluster:
  storage:
    size: 10Gi
    storageClass: local-path
  walStorage:
    enabled: true
    storageClass: nfs-server
  monitoring:
    enabled: true
    podMonitor:
      enabled: true
    prometheusRule:
      enabled: true
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 500Mi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  additionalPodAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpression:
            - key: cnpg.io/cluster
              operator: in
              values:
                - cnpg-test-cluster
        topologyKeY: "kubernetes.io/hostname"
