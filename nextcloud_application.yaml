apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexcloud-app
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://nextcloud.github.io/helm/
      chart: nextcloud
      targetRevision: 9.2.6
      helm:
        valueFiles:
          - $values/nextcloud/values.yaml
    - repoURL: https://github.com/huntrrose/gitops.git
      targetRevision: HEAD
      ref: values

    - repoURL: https://github.com/huntrrose/gitops.git
      targetRevision: HEAD
      path: nextcloud/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNameSpace=true
      - ServerSideApply=True

