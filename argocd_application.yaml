apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-app
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.4.0
      helm:
        valueFiles:
          - $values/ArgoCD/values.yaml
    - repoURL: https://github.com/huntrrose/gitops.git
      targetRevision: HEAD
      ref: values

    - repoURL: https://github.com/huntrrose/gitops.git
      targetRevision: HEAD
      path: ArgoCD/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNameSpace=true
